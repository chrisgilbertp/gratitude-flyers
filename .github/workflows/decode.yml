name: Decode flyers
on:
  push:
    paths: ['flyers-src/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p flyers
          for f in flyers-src/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "flyers/$n.jpg"; done
          git config user.name "flyer-bot"; git config user.email "flyer-bot@users.noreply.github.com"
          git add flyers
          git diff --cached --quiet || (git commit -m "Decode flyers" && git push)
